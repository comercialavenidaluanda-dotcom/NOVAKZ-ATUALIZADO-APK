name: NOVA KZ Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nova-kz.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Extract NOVA KZ project
        run: |
          rm -rf nova-kz-project
          mkdir -p nova-kz-project
          unzip -q nova-kz.zip -d nova-kz-project
          if [ -d "nova-kz-project/nova-kz" ]; then
            shopt -s dotglob
            mv nova-kz-project/nova-kz/* nova-kz-project/
            rmdir nova-kz-project/nova-kz
          fi
          test -f nova-kz-project/settings.gradle.kts
          test -f nova-kz-project/app/build.gradle.kts
          test -f nova-kz-project/gradle/wrapper/gradle-wrapper.properties
      - name: Generate debug keystore for CI fallback
        working-directory: nova-kz-project
        run: |
          keytool -genkeypair -v             -keystore debug.keystore             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US" || true
      - name: Build debug APK
        working-directory: nova-kz-project
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-kz-debug-apk
          path: nova-kz-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run production architecture and unit tests
        working-directory: nova-kz-project
        run: |
          gradle --no-daemon :app:testDebugUnitTest --tests "com.example.NovaApkProductionArchitectureTest" --tests "com.example.NovaKzSupabaseEndToEndAuditTest" --tests "com.example.LegalAcceptanceAndComplianceTest" --tests "com.example.SandboxBalanceSourceOfTruthTest" --tests "com.example.PaymentSandboxFlowTest"
          gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: nova-kz-project
        run: gradle --no-daemon :app:assembleDebug
      - name: Build release APK
        working-directory: nova-kz-project
        run: gradle --no-daemon :app:assembleRelease
      - name: Build release AAB
        working-directory: nova-kz-project
        run: gradle --no-daemon :app:bundleRelease
      - name: Collect build artifacts
        run: |
          mkdir -p artifacts
          cp nova-kz-project/app/build/outputs/apk/debug/app-debug.apk artifacts/app-debug.apk
          cp nova-kz-project/app/build/outputs/apk/release/*.apk artifacts/nova-kz-release.apk
          cp nova-kz-project/app/build/outputs/bundle/release/*.aab artifacts/nova-kz-release.aab
          sha256sum artifacts/* > artifacts/SHA256SUMS.txt
          ls -lh artifacts
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: nova-kz-android-build
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
